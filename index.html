<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04342C">
<title>tlm · metas do dia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="date-label" id="today-date"></div>
    <div class="day-strip-scroll" id="day-strip-scroll">
      <div class="day-strip" id="day-strip"></div>
    </div>
  </header>

  <main class="screen" id="screen-inicio">
    <div class="notif-banner hidden" id="notif-banner">
      <span class="notif-text"></span>
      <button type="button" class="notif-enable hidden" id="notif-enable-btn">Ativar avisos</button>
    </div>

    <section class="card principle-card" id="principle-of-day">
      <div class="card-label principle-label">Princípios</div>
      <div class="principle-text" id="principle-text" contenteditable="true" data-placeholder="Toca para escrever o teu primeiro princípio…"></div>
      <div class="principle-controls">
        <button type="button" class="principle-nav" id="principle-prev" aria-label="Princípio anterior">‹</button>
        <span class="principle-count" id="principle-count"></span>
        <button type="button" class="principle-nav" id="principle-next" aria-label="Princípio seguinte">›</button>
        <span class="principle-controls-spacer"></span>
        <button type="button" class="principle-icon-btn" id="principle-add" aria-label="Adicionar princípio">+</button>
        <button type="button" class="principle-icon-btn danger hidden" id="principle-delete" aria-label="Remover princípio">×</button>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-label">Rotinas de hoje</span>
        <span class="counter" id="routines-counter">0/0</span>
      </div>
      <ul class="list" id="routines-list"></ul>
      <form class="add-row" id="routine-form">
        <input type="text" id="routine-input" placeholder="Nova rotina (ex: tomar comprimidos)" autocomplete="off">
        <button type="submit">+</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-label">Metas da semana</span>
        <span class="counter" id="goals-week-counter">0/0</span>
      </div>
      <ul class="list" id="goals-week-preview"></ul>
      <button class="link-btn" data-nav="metas">Ver todas as metas →</button>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-label">Peso</span>
        <span class="weight-delta" id="weight-delta"></span>
      </div>
      <div class="weight-current" id="weight-current">Ainda sem registos</div>
      <ul class="list" id="weight-list"></ul>
      <form class="add-row weight-form" id="weight-form">
        <input type="number" id="weight-value-input" class="weight-value-input" placeholder="kg" step="0.1" min="0" inputmode="decimal" autocomplete="off">
        <input type="text" id="weight-note-input" placeholder="Nota (opcional)" autocomplete="off">
        <button type="submit">+</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-label">Lembretes</span>
      </div>
      <ul class="list" id="reminders-list"></ul>
      <form class="add-row" id="reminder-form">
        <input type="text" id="reminder-input" placeholder="Novo lembrete" autocomplete="off">
        <button type="submit">+</button>
      </form>
    </section>
  </main>

  <main class="screen hidden" id="screen-metas">
    <div class="tabs" id="goal-tabs">
      <div class="tab-indicator" id="tab-indicator"></div>
      <button class="tab active" data-scope="semana">Semana</button>
      <button class="tab" data-scope="dia">Hoje</button>
    </div>
    <section class="card">
      <ul class="list" id="goals-list"></ul>
      <form class="add-row" id="goal-form">
        <input type="text" id="goal-input" placeholder="Nova meta" autocomplete="off">
        <button type="submit">+</button>
      </form>
    </section>
  </main>

  <main class="screen hidden" id="screen-diario">
    <div class="journal-tabs-scroll" id="journal-tabs-scroll">
      <div class="journal-tabs" id="journal-tabs"></div>
    </div>

    <div class="journal-new-collapse" id="journal-new-collapse">
      <div class="journal-new-form">
        <input type="text" id="journal-new-name" placeholder="Nome do jornal (ex: Mercado)" autocomplete="off">
        <div class="journal-new-type" id="journal-new-type">
          <button type="button" class="slot-chip active" data-type="dates">Com datas</button>
          <button type="button" class="slot-chip" data-type="notebook">Só caderno</button>
        </div>
        <button type="button" class="primary-btn" id="journal-new-confirm">Criar jornal</button>
      </div>
    </div>

    <section class="card">
      <div class="card-label" id="journal-input-label">Nova entrada</div>
      <textarea id="journal-input" class="journal-textarea" placeholder="Como correu o dia?" rows="7"></textarea>
      <button class="primary-btn" id="journal-save">Guardar</button>
    </section>
    <section id="journal-entries"></section>
  </main>

  <main class="screen hidden" id="screen-agenda">
    <section class="card">
      <div class="agenda-header">
        <button type="button" class="agenda-nav-btn" id="agenda-prev" aria-label="Mês anterior">‹</button>
        <span class="agenda-month-label" id="agenda-month-label"></span>
        <button type="button" class="agenda-nav-btn" id="agenda-next" aria-label="Mês seguinte">›</button>
      </div>
      <div class="agenda-weekdays">
        <span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span>
      </div>
      <div class="agenda-grid" id="agenda-grid"></div>
    </section>

    <section class="card agenda-day-card">
      <div class="card-label" id="agenda-selected-label"></div>
      <div class="agenda-untimed-wrap hidden" id="agenda-untimed-wrap">
        <div class="agenda-untimed-label">Sem hora</div>
        <ul class="list" id="agenda-untimed-list"></ul>
      </div>
      <div class="agenda-timeline-scroll" id="agenda-timeline-scroll">
        <div class="agenda-timeline" id="agenda-timeline"></div>
      </div>
      <form id="event-form">
        <div class="add-row">
          <input type="text" id="event-title-input" placeholder="Título (ex: consulta)" autocomplete="off">
          <input type="time" id="event-time-input" class="event-time-input">
          <button type="submit">+</button>
        </div>
        <textarea id="event-notes-input" placeholder="Notas (opcional)" rows="2"></textarea>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <div class="nav-indicator" id="nav-indicator"></div>
    <button class="nav-btn active" data-nav="inicio">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></span>
      <span>Início</span>
    </button>
    <button class="nav-btn" data-nav="metas">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.3"/><path d="M8.3 12.4l2.3 2.3 4.8-5"/></svg></span>
      <span>Metas</span>
    </button>
    <button class="nav-btn" data-nav="diario">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h9.5a1 1 0 0 1 1 1V19l-3-1.8-3 1.8-3-1.8-3 1.8V5.5a1 1 0 0 1 1-1z"/><path d="M8 9h6M8 12h6"/></svg></span>
      <span>Jornal</span>
    </button>
    <button class="nav-btn" data-nav="agenda">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8 3.5v3M16 3.5v3"/></svg></span>
      <span>Agenda</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
